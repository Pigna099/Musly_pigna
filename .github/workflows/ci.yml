name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze (errors only fail the job)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true # upstream test suite is not a gate yet
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --reporter expanded
