name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze (errors only fail the job)
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          {
            echo "### flutter analyze (exit ${status})"
            echo '```'
            tail -n 250 analyze.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Publish analyze log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/comment.json
          import json
          log = open('analyze.log', encoding='utf-8', errors='replace').read()[-12000:]
          print(json.dumps({"body": "### flutter analyze\n```\n" + log + "\n```"}))
          PY
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            --data @/tmp/comment.json > /dev/null

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true # upstream test suite is not a gate yet
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --reporter expanded
